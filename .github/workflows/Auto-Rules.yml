name: Sync REJECT.list

'on':
  # 北京时间每天 06:30 检查上游，也可以在 Actions 页面手动运行。
  schedule:
    - cron: '30 6 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
  # 工作流、同步脚本或手动规则改动时，立即跑一次同步。
  push:
    branches: [main]
    paths:
      - .github/workflows/Auto-Rules.yml
      - .github/workflows/Scripts/sync_reject.py
      - Rules/Manual/REJECT.txt
      - Rules/Manual/REJECT.exclude.txt

# 使用 GitHub 提供的令牌提交名单。
permissions:
  contents: write

# 避免定时任务和手动运行同时写入名单。
concurrency:
  group: sync-reject-list

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPSTREAM_URL: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Surge.list
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Download and validate upstream rules
        shell: bash
        run: |
          # 下载到临时文件，下载失败时保留当前名单。
          upstream=$(mktemp)
          trap 'rm -f "$upstream"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' --connect-timeout 10 \
            --max-time 45 --output "$upstream" "$UPSTREAM_URL"

          python3 .github/workflows/Scripts/sync_reject.py "$upstream"

      - name: Commit changes to REJECT.list
        shell: bash
        run: |
          # 只提交生成的名单，提交标题使用北京时间。
          git add -- REJECT.list
          if git diff --cached --quiet -- REJECT.list; then
            echo 'REJECT.list is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit_time=$(TZ=Asia/Shanghai date "+%Y.%m.%d %H:%M:%S")
          git commit -m "$commit_time Update"
          git push origin HEAD:refs/heads/main

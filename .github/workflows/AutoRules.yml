name: Sync Surge rules

'on':
  # 北京时间每天 07:00 同步 DIRECT、REJECT 和 GlobalAI，也可以手动运行。
  schedule:
    - cron: '0 7 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
  # 工作流、同步脚本或手动规则改动时，立即跑一次同步。
  push:
    branches: [main]
    paths:
      - .github/workflows/AutoRules.yml
      - .github/workflows/Scripts/SyncRules.py
      - .github/workflows/Scripts/SyncDirect.py
      - .github/workflows/Scripts/SyncGlobalAI.py
      - Rules/Manual/GlobalAI.txt
      - Rules/Manual/GlobalAI.approved.txt
      - Rules/Manual/REJECT.txt
      - Rules/Manual/REJECT.exclude.txt

# 使用 GitHub 提供的令牌提交名单。
permissions:
  contents: write

# 避免定时任务和手动运行同时写入名单。
concurrency:
  group: sync-surge-rules

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM_URL: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Surge.list
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        id: checkout
        with:
          ref: main

      - name: Sync REJECT.list
        id: reject
        shell: bash
        run: |
          # 下载到临时文件，下载失败时保留当前名单。
          upstream=$(mktemp)
          trap 'rm -f "$upstream"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' --connect-timeout 10 \
            --max-time 45 --output "$upstream" "$UPSTREAM_URL"

          python3 .github/workflows/Scripts/SyncRules.py "$upstream"

      - name: Load approved DIRECT scope
        id: direct_scope
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          # 固定快照限制 DIRECT 自动纳入的范围，也用于防止 GlobalAI 覆盖已审核直连。
          DIRECT_BASELINE: 0ca36e36e56af9bbee9f6f187afb0a76f73d721b
        run: |
          git fetch --no-tags --depth 1 origin "$DIRECT_BASELINE"
          git show "${DIRECT_BASELINE}:DIRECT.list" > "$RUNNER_TEMP/direct-baseline.list"

      - name: Sync DIRECT.list
        id: direct
        if: ${{ !cancelled() && steps.direct_scope.outcome == 'success' }}
        shell: bash
        run: |
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT

          # 固定到同一个 release 提交，避免四份文件来自不同版本。
          ref=$(git ls-remote --exit-code https://github.com/Loyalsoldier/surge-rules.git refs/heads/release)
          revision=${ref%%$'\t'*}
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          upstream_url="https://raw.githubusercontent.com/Loyalsoldier/surge-rules/$revision"
          echo "Loyalsoldier release commit $revision"
          for list in direct.txt private.txt apple.txt icloud.txt; do
            curl --fail --silent --show-error --location --retry 3 \
              --proto '=https' --proto-redir '=https' --connect-timeout 10 \
              --max-time 45 --output "$workdir/$list" "$upstream_url/$list"
          done

          python3 .github/workflows/Scripts/SyncDirect.py "$workdir" "$RUNNER_TEMP/direct-baseline.list"

      - name: Sync GlobalAI.list
        id: globalai
        if: ${{ !cancelled() && steps.direct_scope.outcome == 'success' }}
        shell: bash
        run: |
          python3 .github/workflows/Scripts/SyncGlobalAI.py "$RUNNER_TEMP/direct-baseline.list"

      - name: Commit changes to rule lists
        if: ${{ !cancelled() && (steps.reject.outcome == 'success' || steps.direct.outcome == 'success' || steps.globalai.outcome == 'success') }}
        shell: bash
        env:
          REJECT_OUTCOME: ${{ steps.reject.outcome }}
          DIRECT_OUTCOME: ${{ steps.direct.outcome }}
          GLOBALAI_OUTCOME: ${{ steps.globalai.outcome }}
        run: |
          # 分别暂存成功生成的名单，单一上游失败时继续发布另一份。
          if [[ "$REJECT_OUTCOME" == success ]]; then
            git add -- REJECT.list
          fi
          if [[ "$DIRECT_OUTCOME" == success ]]; then
            git add -- DIRECT.list
          fi
          if [[ "$GLOBALAI_OUTCOME" == success ]]; then
            git add -- GlobalAI.list
          fi
          if git diff --cached --quiet -- REJECT.list DIRECT.list GlobalAI.list; then
            echo 'Rule lists are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit_time=$(TZ=Asia/Shanghai date "+%Y.%m.%d %H:%M:%S")
          git commit -m "$commit_time Update"
          git push origin HEAD:refs/heads/main
